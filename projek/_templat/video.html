<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Tajuk video</title>
<meta name="duration" content="20">
<meta name="fps" content="30">
<link rel="stylesheet" href="../../.claude/skills/vox-style-video/templates/kit.css">
<link rel="stylesheet" href="../../infografik/infografik.css">
</head>
<body>
<div class="stage">

  <!-- Babak: --start (saat mutlak), --dur; anak guna --d (relatif) -->
  <section class="scene" style="--start:0;--dur:5">
    <div class="col center">
      <div class="kicker in-fade" style="--d:.1">Infografik</div>
      <h1 class="headline in-up" style="--d:.3">Soalan utama dengan <span class="hl" style="--d:.6">kata kunci</span></h1>
    </div>
  </section>

  <section class="scene" style="--start:5;--dur:5">
    <div class="row">
      <div class="donut" style="--v:62;--d:.3;--size:460px"></div>
      <div class="col">
        <div class="pct" style="--to:62;--d:.3"></div>
        <div class="body in-fade" style="--d:1">penerangan angka</div>
        <div class="source in-fade" style="--d:1.4">Data ilustrasi</div>
      </div>
    </div>
  </section>

  <section class="scene" style="--start:10;--dur:5">
    <div class="col" style="gap:50px">
      <div class="headline md in-up" style="--d:.1">Kedudukan</div>
      <div class="hbars">
        <div class="hbar key" style="--v:90;--d:.3"><label>A</label><i></i><span>90</span></div>
        <div class="hbar" style="--v:65;--d:.45"><label>B</label><i></i><span>65</span></div>
        <div class="hbar" style="--v:40;--d:.6"><label>C</label><i></i><span>40</span></div>
      </div>
      <div class="source in-fade" style="--d:1.4">Data ilustrasi</div>
    </div>
  </section>

  <section class="scene dark" style="--start:15;--dur:5">
    <div class="col center">
      <div class="headline in-up" style="--d:.3">Kesimpulan <span class="hl" style="--d:.6">satu ayat.</span></div>
    </div>
  </section>

</div>
</body>
</html>
